<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      background: #121212;
      color: #eee;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    h2 { color: #4CAF50; margin-top: 0; }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
    }
    button:active { background: #3e8e41; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      min-height: 50px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tábor Tracker</h2>

    <button onclick="connectAndTrack()">PŘIPOJIT A SPUSTIT GPS</button>

    <div id="status">Stav: Čeká na připojení...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let socket = null;
    let watchId = null;

    function connectAndTrack() {
      const status = document.getElementById("status");
      status.innerHTML = "Připojuji k WebSocketu ws://192.168.4.1:81...";

      // Otevření WebSocket spojení přímo na ESP32
      socket = new WebSocket("ws://192.168.4.1:81");

      socket.onopen = () => {
        status.innerHTML = "<b style='color:#4CAF50;'>WebSocket připojen!</b><br>Spouštím GPS sledování...";
        startGps();
      };

      socket.onmessage = (event) => {
        console.log("ESP32:", event.data);
      };

      socket.onerror = (error) => {
        status.innerHTML = "<b style='color:red;'>Chyba WebSocketu.</b> Zkontroluj, zda jsi na Wi-Fi Tabor-Tracker-A.";
      };

      socket.onclose = () => {
        status.innerHTML += "<br><span style='color:orange;'>WebSocket odpojen.</span>";
      };
    }

    function startGps() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML = "<b style='color:red;'>Geolokace není podporována.</b>";
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const payload = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: pos.timestamp
          };

          status.innerHTML = `<b style='color:#4CAF50;'>Spojení aktivní:</b><br>Lat: ${payload.latitude.toFixed(6)}<br>Lon: ${payload.longitude.toFixed(6)}<br>Přesnost: ±${payload.accuracy.toFixed(1)} m<br>Odesláno na ESP32 via WS.`;

          // Odeslání do ESP32 přes otevřený socket
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(payload));
          }
        },
        (err) => {
          status.innerHTML = `<b style='color:red;'>Chyba GPS:</b> ${err.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
