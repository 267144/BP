<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>

  <!-- MapLibre GL JS & PMTiles -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #1e1e1e;
    }
    .panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 10;
      border: 1px solid #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    button, label.btn {
      display: block;
      text-align: center;
      background: #2196F3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 0;
      box-sizing: border-box;
      text-decoration: none;
    }
    button:active, label.btn:active { background: #0b7dda; }
    .btn-reset {
      background: #c62828 !important;
      font-size: 13px !important;
      padding: 8px !important;
      margin-top: 8px !important;
    }
    .btn-reset:active { background: #8e0000 !important; }
    #status {
      font-size: 13px;
      margin-top: 6px;
      color: #bbb;
      line-height: 1.4;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background: #333;
      color: #4CAF50;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel">
    <div id="mapInfo" style="margin-bottom: 6px; font-size: 12px; color: #aaa;">Žádná mapa není načtena</div>

    <input type="file" id="mapFileInput" accept=".pmtiles" style="display:none;" onchange="handleFileSelection(event)">
    <label class="btn" id="lblChoose" for="mapFileInput">📁 VYBRAT .PMTILES SOUBOR</label>

    <button id="btnConnect" onclick="connectBle()" style="display:none; background: #4CAF50;">📡 PŘIPOJIT ESP32 (BLE)</button>
    <button id="btnReset" class="btn-reset" onclick="resetApp()">🗑️ SMAZAT / RESETOVAT MAPU</button>

    <div id="status">Vyberte soubor mapy z paměti telefonu.</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let map = null;
    let userMarker = null;
    let bleCharacteristic = null;
    let watchId = null;

    // Inicializace protokolu pmtiles
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    function resetApp() {
      // Vyčistit lokální úložiště
      localStorage.clear();

      if (map) {
        map.remove();
        map = null;
      }
      userMarker = null;

      // Reset formuláře
      document.getElementById("mapFileInput").value = "";
      document.getElementById("mapInfo").innerHTML = "Žádná mapa není načtena";
      document.getElementById("lblChoose").style.display = "block";
      document.getElementById("btnConnect").style.display = "none";
      document.getElementById("status").innerHTML = "<span style='color:#4CAF50;'>Aplikace resetována.</span> Vyberte nový soubor.";
    }

    async function handleFileSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
      document.getElementById("status").innerText = `Čtu hlavičku souboru (${sizeMb} MB)...`;

      try {
        const p = new pmtiles.PMTiles(new pmtiles.FileSource(file));
        protocol.add(p);

        // Ověříme integritu souboru přečtením hlavičky
        const header = await p.getHeader();
        console.log("PMTiles Header:", header);

        initMapWithPMTiles(p, file.name, header);
      } catch (err) {
        console.error("Chyba čtení PMTiles:", err);
        document.getElementById("status").innerHTML = `<b style='color:red;'>Neplatný soubor:</b> ${err.message}`;
      }
    }

    function initMapWithPMTiles(pInstance, fileName, header) {
      document.getElementById("mapInfo").innerHTML = `Mapa: <span class="badge">${fileName}</span>`;
      document.getElementById("status").innerText = "Inicializuji zobrazení...";

      if (map) {
        map.remove();
        userMarker = null;
      }

      // Univerzální bezpečný styl pro OpenMapTiles / Protomaps
      const style = {
        version: 8,
        sources: {
          "pmtiles-source": {
            type: "vector",
            url: `pmtiles://${pInstance.source.key}`
          }
        },
        layers: [
          {
            id: "background",
            type: "background",
            paint: { "background-color": "#1a1f1d" }
          },
          {
            id: "water",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "water",
            paint: { "fill-color": "#23496d" }
          },
          {
            id: "landcover",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "landcover",
            paint: { "fill-color": "#243427", "fill-opacity": 0.6 }
          },
          {
            id: "park",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "park",
            paint: { "fill-color": "#2e4632" }
          },
          {
            id: "roads",
            type: "line",
            source: "pmtiles-source",
            "source-layer": "transportation",
            paint: { "line-color": "#8b8579", "line-width": 1.2 }
          },
          {
            id: "roads-fallback",
            type: "line",
            source: "pmtiles-source",
            "source-layer": "roads",
            paint: { "line-color": "#8b8579", "line-width": 1.2 }
          },
          {
            id: "buildings",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "building",
            paint: { "fill-color": "#3a3a3a", "fill-opacity": 0.7 }
          }
        ]
      };

      const centerLon = header.centerLon || (header.minLon + header.maxLon) / 2 || 15.0;
      const centerLat = header.centerLat || (header.minLat + header.maxLat) / 2 || 50.0;
      const startZoom = header.centerZoom || Math.max(header.minZoom || 0, 7);

      map = new maplibregl.Map({
        container: 'map',
        style: style,
        center: [centerLon, centerLat],
        zoom: startZoom,
        minZoom: header.minZoom || 0,
        maxZoom: header.maxZoom || 16
      });

      map.on('error', (e) => {
        // Některé vrstvy v souboru nemusí existovat, to nevadí
        console.warn("MapLibre zpráva:", e);
      });

      map.on('load', () => {
        document.getElementById("lblChoose").style.display = "none";
        document.getElementById("btnConnect").style.display = "block";
        document.getElementById("status").innerHTML = `<b style='color:#4CAF50;'>Mapa připravena!</b> Zoom: ${startZoom.toFixed(1)}`;
      });
    }

    async function connectBle() {
      const status = document.getElementById("status");
      try {
        status.innerText = "Hledám krabičku přes BLE...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Tabor-Tracker-A" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById("btnConnect").style.display = "none";
        status.innerHTML = "<b style='color:#4CAF50;'>BLE Připojeno!</b> Sleduji GPS...";

        startGps();
      } catch (err) {
        status.innerText = "Chyba BLE: " + err.message;
      }
    }

    function startGps() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          if (!userMarker && map) {
            userMarker = new maplibregl.Marker({ color: "#2196F3" })
              .setLngLat([lon, lat])
              .addTo(map);
            map.flyTo({ center: [lon, lat], zoom: 14 });
          } else if (userMarker) {
            userMarker.setLngLat([lon, lat]);
          }

          if (bleCharacteristic) {
            const payload = JSON.stringify({
              lat: Number(lat.toFixed(6)),
              lon: Number(lon.toFixed(6)),
              acc: Number(acc.toFixed(1))
            });
            try {
              await bleCharacteristic.writeValue(new TextEncoder().encode(payload));
            } catch (e) {
              console.warn("Chyba BLE zápisu:", e);
            }
          }
        },
        (err) => console.warn(err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
