<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Tábor Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      background: #121212;
      color: #eee;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    h2 { color: #4CAF50; margin-top: 0; }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
    }
    button:active { background: #3e8e41; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      min-height: 60px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tábor Tracker (PWA)</h2>
    <p>Odesílání polohy telefonu do krabičky vedoucího přes Wi-Fi AP.</p>

    <button onclick="startTracking()">1. SPUSTIT GPS A ODESÍLÁNÍ</button>

    <div id="status">Stav: Čeká na spuštění</div>
  </div>

  <script>
    // Registrace Service Workeru pro offline režim
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let watchId = null;

    function startTracking() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML = "<b style='color:red;'>Geolokace není podporována.</b>";
        return;
      }

      status.innerHTML = "Získávám GPS polohu...";

      // watchPosition sleduje polohu kontinuálně při chůzi
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const payload = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: pos.timestamp
          };

          status.innerHTML = `<b>GPS Získána:</b><br>Lat: ${payload.latitude.toFixed(6)}<br>Lon: ${payload.longitude.toFixed(6)}<br>Přesnost: ±${payload.accuracy.toFixed(1)} m<br><br>Odesílám do ESP32 (192.168.4.1)...`;

          // Odeslání do ESP32 běžícího na Wi-Fi
          fetch("http://192.168.4.1/api/location", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
          .then(res => res.text())
          .then(txt => {
            status.innerHTML += `<br><b style='color:#4CAF50;'>Uloženo do ESP32! [${txt}]</b>`;
          })
          .catch(err => {
            status.innerHTML += `<br><span style='color:orange;'>ESP32 nedostupný (zkontroluj připojení k Wi-Fi Tabor-Tracker)</span>`;
          });
        },
        (err) => {
          status.innerHTML = `<b style='color:red;'>Chyba GPS:</b> ${err.message}`;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
