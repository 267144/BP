<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      background: #121212;
      color: #eee;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    h2 { color: #4CAF50; margin-top: 0; }
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
    }
    button:active { background: #0b7dda; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      min-height: 50px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tábor Tracker (Bluetooth)</h2>
    <p>Přenos polohy telefonu do krabičky vedoucího přes BLE.</p>

    <button id="btnConnect" onclick="connectBle()">PŘIPOJIT PŘES BLUETOOTH</button>

    <div id="status">Stav: Bluetooth nepřipojen</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bleCharacteristic = null;
    let watchId = null;

    async function connectBle() {
      const status = document.getElementById("status");

      if (!navigator.bluetooth) {
        status.innerHTML = "<b style='color:red;'>Web Bluetooth není tímto prohlížečem podporován. Použijte Chrome pro Android.</b>";
        return;
      }

      try {
        status.innerHTML = "Hledám krabičku přes Bluetooth...";

        // Vyžádání zařízení přes systémový dialog
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Tabor-Tracker-A" }],
          optionalServices: [SERVICE_UUID]
        });

        status.innerHTML = "Připojuji k zařízení...";
        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        status.innerHTML = "<b style='color:#4CAF50;'>Bluetooth spárován!</b><br>Spouštím GPS sledování...";
        document.getElementById("btnConnect").style.display = "none";

        bleDevice.addEventListener('gattserverdisconnected', () => {
          status.innerHTML = "<b style='color:red;'>Bluetooth odpojen.</b>";
          document.getElementById("btnConnect").style.display = "block";
          if (watchId) navigator.geolocation.clearWatch(watchId);
        });

        startGps();

      } catch (error) {
        status.innerHTML = `<b style='color:orange;'>Připojení zrušeno nebo selhalo:</b> ${error.message}`;
      }
    }

    function startGps() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML += "<br><b style='color:red;'>Geolokace není dostupná.</b>";
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          // Kompaktní JSON pro úsporu BLE MTU
          const payload = JSON.stringify({
            lat: Number(pos.coords.latitude.toFixed(6)),
            lon: Number(pos.coords.longitude.toFixed(6)),
            acc: Number(pos.coords.accuracy.toFixed(1))
          });

          status.innerHTML = `<b style='color:#4CAF50;'>Spojení aktivní (BLE):</b><br>Lat: ${pos.coords.latitude.toFixed(6)}<br>Lon: ${pos.coords.longitude.toFixed(6)}<br>Přesnost: ±${pos.coords.accuracy.toFixed(1)} m<br><br>Odesílám do ESP32...`;

          if (bleCharacteristic) {
            try {
              const encoder = new TextEncoder();
              await bleCharacteristic.writeValue(encoder.encode(payload));
              status.innerHTML += "<br><span style='color:#4CAF50;'>Zapsáno do ESP32 (OK)</span>";
            } catch (err) {
              status.innerHTML += `<br><span style='color:red;'>Chyba zápisu: ${err.message}</span>`;
            }
          }
        },
        (err) => {
          status.innerHTML = `<b style='color:red;'>Chyba GPS:</b> ${err.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
