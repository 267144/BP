<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>

  <!-- MapLibre GL JS & PMTiles v3 -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #1e1e1e;
    }
    .panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 10;
      border: 1px solid #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    button, label.btn {
      display: block;
      text-align: center;
      background: #2196F3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 0;
      box-sizing: border-box;
      text-decoration: none;
    }
    button:active, label.btn:active { background: #0b7dda; }
    .btn-reset {
      background: #c62828 !important;
      font-size: 13px !important;
      padding: 8px !important;
      margin-top: 8px !important;
    }
    .btn-reset:active { background: #8e0000 !important; }
    #status {
      font-size: 13px;
      margin-top: 6px;
      color: #bbb;
      line-height: 1.4;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background: #333;
      color: #4CAF50;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel">
    <div id="mapInfo" style="margin-bottom: 6px; font-size: 12px; color: #aaa;">Kontroluji uloženou mapu...</div>

    <input type="file" id="mapFileInput" accept=".pmtiles" style="display:none;" onchange="handleFileSelection(event)">
    <label class="btn" id="lblChoose" for="mapFileInput" style="display:none;">📁 VYBRAT .PMTILES SOUBOR</label>

    <button id="btnConnect" onclick="connectBle()" style="display:none; background: #4CAF50;">📡 PŘIPOJIT ESP32 (BLE)</button>
    <button id="btnReset" class="btn-reset" onclick="resetApp()" style="display:none;">🗑️ ZMĚNIT / SMAZAT MAPU</button>

    <div id="status">Načítám...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let map = null;
    let userMarker = null;
    let bleCharacteristic = null;
    let watchId = null;

    // --- IndexedDB vrstva pro trvalé uchování odkazu na soubor ---
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("TaborTrackerDB", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeFileHandle(fileOrHandle, name) {
      const db = await openDb();
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put({ data: fileOrHandle, name: name }, "active_map");
      return tx.complete;
    }

    async function getStoredFileHandle() {
      const db = await openDb();
      return new Promise((resolve) => {
        const tx = db.transaction("handles", "readonly");
        const req = tx.objectStore("handles").get("active_map");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function clearStoredFileHandle() {
      const db = await openDb();
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").delete("active_map");
      return tx.complete;
    }

    // --- PMTiles Adaptér ---
    class LocalFileSource {
      constructor(file) {
        this.file = file;
        this.key = "local://" + (file.name || "map.pmtiles");
      }
      async getBytes(offset, length) {
        const slice = this.file.slice(offset, offset + length);
        const buffer = await slice.arrayBuffer();
        return { data: buffer };
      }
      getKey() {
        return this.key;
      }
    }

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    async function resetApp() {
      await clearStoredFileHandle();
      if (map) {
        map.remove();
        map = null;
      }
      userMarker = null;

      document.getElementById("mapFileInput").value = "";
      document.getElementById("mapInfo").innerHTML = "Žádná mapa není načtena";
      document.getElementById("lblChoose").style.display = "block";
      document.getElementById("btnConnect").style.display = "none";
      document.getElementById("btnReset").style.display = "none";
      document.getElementById("status").innerHTML = "<span style='color:#4CAF50;'>Paměť vyčištěna.</span> Vyberte nový soubor.";
    }

    async function handleFileSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("status").innerText = `Ukládám a čtu mapu (${(file.size / (1024*1024)).toFixed(0)} MB)...`;

      try {
        await storeFileHandle(file, file.name);
        await loadMapFromFile(file, file.name);
      } catch (err) {
        console.error("Chyba:", err);
        document.getElementById("status").innerHTML = `<b style='color:red;'>Chyba:</b> ${err.message}`;
      }
    }

    async function loadMapFromFile(file, fileName) {
      document.getElementById("mapInfo").innerHTML = `Aktivní mapa: <span class="badge">${fileName}</span>`;
      document.getElementById("status").innerText = "Inicializuji vrstvy...";

      const source = (pmtiles.FileSource) ? new pmtiles.FileSource(file) : new LocalFileSource(file);
      const p = new pmtiles.PMTiles(source);
      protocol.add(p);

      const header = await p.getHeader();

      if (map) {
        map.remove();
        userMarker = null;
      }

      // Vektorový styl s podporou hlubokého zoomu (overzooming)
      const style = {
        version: 8,
        sources: {
          "pmtiles-source": {
            type: "vector",
            url: `pmtiles://${p.source.getKey()}`,
            maxzoom: header.maxZoom || 14 // Zdroj končí na maxZoom, ale mapa zoomuje dál!
          }
        },
        layers: [
          {
            id: "background",
            type: "background",
            paint: { "background-color": "#1a1f1d" }
          },
          {
            id: "water",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "water",
            paint: { "fill-color": "#23496d" }
          },
          {
            id: "landcover",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "landcover",
            paint: { "fill-color": "#243427", "fill-opacity": 0.5 }
          },
          {
            id: "park",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "park",
            paint: { "fill-color": "#2e4632" }
          },
          {
            id: "roads",
            type: "line",
            source: "pmtiles-source",
            "source-layer": "transportation",
            paint: { "line-color": "#9e9687", "line-width": 1.5 }
          },
          {
            id: "roads-fallback",
            type: "line",
            source: "pmtiles-source",
            "source-layer": "roads",
            paint: { "line-color": "#9e9687", "line-width": 1.5 }
          },
          {
            id: "buildings",
            type: "fill",
            source: "pmtiles-source",
            "source-layer": "building",
            paint: { "fill-color": "#333333", "fill-opacity": 0.7 }
          }
        ]
      };

      const centerLon = header.centerLon || (header.minLon + header.maxLon) / 2 || 15.0;
      const centerLat = header.centerLat || (header.minLat + header.maxLat) / 2 || 50.0;
      const startZoom = header.centerZoom || Math.max(header.minZoom || 0, 8);

      map = new maplibregl.Map({
        container: 'map',
        style: style,
        center: [centerLon, centerLat],
        zoom: startZoom,
        minZoom: 0,
        maxZoom: 21 // Zde je umožněn detailní hluboký zoom až do úrovně 21
      });

      map.on('load', () => {
        document.getElementById("lblChoose").style.display = "none";
        document.getElementById("btnConnect").style.display = "block";
        document.getElementById("btnReset").style.display = "block";
        document.getElementById("status").innerHTML = "<b style='color:#4CAF50;'>Mapa připravena!</b> Můžete přiblížit i připojit BLE.";
      });
    }

    // Automatická kontrola uložené mapy při každém otevření aplikace
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const stored = await getStoredFileHandle();
        if (stored && stored.data) {
          document.getElementById("status").innerText = "Načítám zapamatovanou mapu z telefonu...";
          let file = stored.data;
          // Pokud je to FileHandle, získáme File
          if (file.getFile) file = await file.getFile();
          await loadMapFromFile(file, stored.name || "Uložená mapa");
        } else {
          document.getElementById("mapInfo").innerHTML = "Žádná mapa není načtena";
          document.getElementById("lblChoose").style.display = "block";
          document.getElementById("status").innerText = "Vyberte soubor mapy (.pmtiles) z telefonu.";
        }
      } catch (err) {
        console.warn("Chyba auto-loadu:", err);
        document.getElementById("lblChoose").style.display = "block";
        document.getElementById("status").innerText = "Vyberte soubor mapy z paměti telefonu.";
      }
    });

    async function connectBle() {
      const status = document.getElementById("status");
      try {
        status.innerText = "Hledám krabičku přes BLE...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Tabor-Tracker-A" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById("btnConnect").style.display = "none";
        status.innerHTML = "<b style='color:#4CAF50;'>BLE Připojeno!</b> Sleduji GPS...";

        startGps();
      } catch (err) {
        status.innerText = "Chyba BLE: " + err.message;
      }
    }

    function startGps() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          if (!userMarker && map) {
            userMarker = new maplibregl.Marker({ color: "#2196F3" })
              .setLngLat([lon, lat])
              .addTo(map);
            map.flyTo({ center: [lon, lat], zoom: 16 });
          } else if (userMarker) {
            userMarker.setLngLat([lon, lat]);
          }

          if (bleCharacteristic) {
            const payload = JSON.stringify({
              lat: Number(lat.toFixed(6)),
              lon: Number(lon.toFixed(6)),
              acc: Number(acc.toFixed(1))
            });
            try {
              await bleCharacteristic.writeValue(new TextEncoder().encode(payload));
            } catch (e) {
              console.warn("Chyba BLE zápisu:", e);
            }
          }
        },
        (err) => console.warn(err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
