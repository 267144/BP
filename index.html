<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>

  <!-- MapLibre GL JS & PMTiles -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #eee;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #1a1a1a;
    }
    /* Tlačítko pro změnu mapy v pravém horním rohu */
    #btnChangeMap {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #555;
      color: #eee;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    /* Spodní ovládací panel */
    .panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(30, 30, 30, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 10;
      border: 1px solid #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button, label.btn {
      display: block;
      text-align: center;
      background: #2196F3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 0;
      text-decoration: none;
      box-sizing: border-box;
    }
    button:active, label.btn:active { background: #0b7dda; }
    #status {
      font-size: 13px;
      margin-top: 6px;
      color: #bbb;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background: #444;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Plovoucí tlačítko pro výměnu mapového souboru -->
  <div id="btnChangeMap" title="Změnit mapový soubor (.pmtiles)" onclick="triggerFileInput()">🗺️</div>
  <input type="file" id="mapFileInput" accept=".pmtiles" style="display:none;" onchange="handleFileSelection(event)">

  <div class="panel">
    <div id="mapInfo" style="margin-bottom: 6px; font-size: 12px; color: #888;">Žádná mapa není načtena</div>

    <label class="btn" id="lblChoose" for="mapFileInput">NAHRÁT SOUBOR MAPY (.pmtiles)</label>
    <button id="btnConnect" onclick="connectBle()" style="display:none; background: #4CAF50;">PŘIPOJIT ESP32 (BLE)</button>

    <div id="status">Vyberte soubor mapy z paměti telefonu.</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let map = null;
    let userMarker = null;
    let bleCharacteristic = null;
    let watchId = null;

    // Registrace PMTiles protokolu
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    function triggerFileInput() {
      document.getElementById('mapFileInput').click();
    }

    // Uložení a načtení mapy přes OPFS (Origin Private File System)
    async function getOpfsRoot() {
      return await navigator.storage.getDirectory();
    }

    async function saveMapToOpfs(file) {
      const root = await getOpfsRoot();
      const fileHandle = await root.getFileHandle("current_map.pmtiles", { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(file);
      await writable.close();
      localStorage.setItem("saved_map_name", file.name);
    }

    async function loadSavedMapFromOpfs() {
      try {
        const root = await getOpfsRoot();
        const fileHandle = await root.getFileHandle("current_map.pmtiles");
        const file = await fileHandle.getFile();
        const mapName = localStorage.getItem("saved_map_name") || file.name;
        initMapWithFile(file, mapName);
      } catch (e) {
        // Soubor ještě v paměti není – čekáme na první výběr uživatelem
        document.getElementById("status").innerText = "Vyberte soubor mapy z paměti telefonu.";
      }
    }

    async function handleFileSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("status").innerText = "Ukládám mapu do paměti aplikace...";
      try {
        await saveMapToOpfs(file);
        initMapWithFile(file, file.name);
      } catch (err) {
        // Fallback pro prohlížeče bez plné podpory OPFS
        initMapWithFile(file, file.name);
      }
    }

    function initMapWithFile(file, name) {
      document.getElementById("mapInfo").innerHTML = `Aktivní mapa: <span class="badge">${name}</span>`;
      document.getElementById("status").innerHTML = "Načítám vektorové dlaždice...";

      const p = new pmtiles.PMTiles(new pmtiles.FileSource(file));
      protocol.add(p);

      if (map) {
        map.remove();
        userMarker = null;
      }

      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            "offline-source": {
              type: "vector",
              url: `pmtiles://${p.source.key}`
            }
          },
          layers: [
            {
              id: "background",
              type: "background",
              paint: { "background-color": "#1f2421" }
            },
            {
              id: "water",
              type: "fill",
              source: "offline-source",
              "source-layer": "water",
              paint: { "fill-color": "#214e68" }
            },
            {
              id: "landuse",
              type: "fill",
              source: "offline-source",
              "source-layer": "landuse",
              paint: { "fill-color": "#28382c" }
            },
            {
              id: "roads",
              type: "line",
              source: "offline-source",
              "source-layer": "roads",
              paint: { "line-color": "#8c8275", "line-width": 1.2 }
            }
          ]
        },
        center: [15.0, 50.0],
        zoom: 7
      });

      map.on('load', () => {
        document.getElementById("lblChoose").style.display = "none";
        document.getElementById("btnConnect").style.display = "block";
        document.getElementById("status").innerHTML = "<b style='color:#4CAF50;'>Mapa připravena.</b> Nyní připojte centrálu.";
      });
    }

    async function connectBle() {
      const status = document.getElementById("status");
      try {
        status.innerText = "Hledám krabičku přes BLE...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Tabor-Tracker-A" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById("btnConnect").style.display = "none";
        status.innerHTML = "<b style='color:#4CAF50;'>BLE Připojeno!</b> Sleduji GPS a centrálu...";

        startGps();
      } catch (err) {
        status.innerText = "Chyba BLE: " + err.message;
      }
    }

    function startGps() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          if (!userMarker && map) {
            userMarker = new maplibregl.Marker({ color: "#2196F3" })
              .setLngLat([lon, lat])
              .addTo(map);
            map.flyTo({ center: [lon, lat], zoom: 14 });
          } else if (userMarker) {
            userMarker.setLngLat([lon, lat]);
          }

          if (bleCharacteristic) {
            const payload = JSON.stringify({
              lat: Number(lat.toFixed(6)),
              lon: Number(lon.toFixed(6)),
              acc: Number(acc.toFixed(1))
            });
            try {
              await bleCharacteristic.writeValue(new TextEncoder().encode(payload));
            } catch (e) {
              console.warn("Chyba BLE zápisu:", e);
            }
          }
        },
        (err) => console.warn(err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Při startu aplikace zkontrolujeme, zda už máme mapu v paměti
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedMapFromOpfs();
    });
  </script>
</body>
</html>
