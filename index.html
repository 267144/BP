<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Tábor Tracker</title>

  <!-- MapLibre GL JS & PMTiles -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
  <!-- Oficiální styl pro Protomaps/PMTiles OSM data -->
  <script src="https://unpkg.com/protomaps-themes-base@1.3.1/dist/index.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #222;
    }
    #btnChangeMap {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #555;
      color: #eee;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(30, 30, 30, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 10;
      border: 1px solid #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button, label.btn {
      display: block;
      text-align: center;
      background: #2196F3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 0;
      box-sizing: border-box;
    }
    button:active, label.btn:active { background: #0b7dda; }
    #status {
      font-size: 13px;
      margin-top: 6px;
      color: #bbb;
      line-height: 1.4;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background: #444;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="btnChangeMap" title="Zvolit jinou mapu" onclick="triggerFileInput()">🗺️</div>
  <input type="file" id="mapFileInput" accept=".pmtiles" style="display:none;" onchange="handleFileSelection(event)">

  <div class="panel">
    <div id="mapInfo" style="margin-bottom: 6px; font-size: 12px; color: #888;">Žádná mapa není načtena</div>

    <label class="btn" id="lblChoose" for="mapFileInput">VYBRAT PMTILES SOUBOR</label>
    <button id="btnConnect" onclick="connectBle()" style="display:none; background: #4CAF50;">PŘIPOJIT ESP32 (BLE)</button>

    <div id="status">Vyberte soubor mapy z paměti telefonu.</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let map = null;
    let userMarker = null;
    let bleCharacteristic = null;
    let watchId = null;

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    function triggerFileInput() {
      document.getElementById('mapFileInput').click();
    }

    function handleFileSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("status").innerText = "Otevírám soubor (" + (file.size / (1024*1024)).toFixed(1) + " MB)...";
      initMap(file, file.name);
    }

    async function initMap(file, name) {
      document.getElementById("mapInfo").innerHTML = `Aktivní mapa: <span class="badge">${name}</span>`;
      
      try {
        const p = new pmtiles.PMTiles(new pmtiles.FileSource(file));
        protocol.add(p);

        // Zjištění rozsahu a metadat ze souboru (zda je to platný PMTiles)
        const header = await p.getHeader();
        console.log("PMTiles Header:", header);

        if (map) {
          map.remove();
          userMarker = null;
        }

        // Automatické generování kompletního stylu (silnice, lesy, řeky, budovy)
        // pro zdroj 'protomaps'
        const layers = protomapsThemesBase.default("protomaps", "dark");

        map = new maplibregl.Map({
          container: 'map',
          style: {
            version: 8,
            glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
            sources: {
              "protomaps": {
                type: "vector",
                url: `pmtiles://${p.source.key}`
              }
            },
            layers: layers
          },
          center: [header.centerLon || 15.0, header.centerLat || 50.0],
          zoom: header.centerZoom || 7,
          minZoom: header.minZoom || 0,
          maxZoom: header.maxZoom || 15
        });

        map.on('error', (e) => {
          console.error("MapLibre error:", e);
          document.getElementById("status").innerHTML = `<b style='color:orange;'>Chyba vrstvy:</b> ${e.error?.message || 'Nelze vykreslit dlaždici'}`;
        });

        map.on('load', () => {
          document.getElementById("lblChoose").style.display = "none";
          document.getElementById("btnConnect").style.display = "block";
          document.getElementById("status").innerHTML = "<b style='color:#4CAF50;'>Mapa vykreslena!</b> Můžete připojit ESP32.";
        });

      } catch (err) {
        console.error("Chyba při otevírání:", err);
        document.getElementById("status").innerHTML = `<b style='color:red;'>Chyba souboru:</b> ${err.message}. Ujistěte se, že jde o validní PMTiles.`;
      }
    }

    async function connectBle() {
      const status = document.getElementById("status");
      try {
        status.innerText = "Hledám krabičku přes BLE...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Tabor-Tracker-A" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById("btnConnect").style.display = "none";
        status.innerHTML = "<b style='color:#4CAF50;'>BLE Připojeno!</b> Sleduji GPS...";

        startGps();
      } catch (err) {
        status.innerText = "Chyba BLE: " + err.message;
      }
    }

    function startGps() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          if (!userMarker && map) {
            userMarker = new maplibregl.Marker({ color: "#2196F3" })
              .setLngLat([lon, lat])
              .addTo(map);
            map.flyTo({ center: [lon, lat], zoom: 14 });
          } else if (userMarker) {
            userMarker.setLngLat([lon, lat]);
          }

          if (bleCharacteristic) {
            const payload = JSON.stringify({
              lat: Number(lat.toFixed(6)),
              lon: Number(lon.toFixed(6)),
              acc: Number(acc.toFixed(1))
            });
            try {
              await bleCharacteristic.writeValue(new TextEncoder().encode(payload));
            } catch (e) {
              console.warn("Chyba BLE zápisu:", e);
            }
          }
        },
        (err) => console.warn(err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
